# Server settings
api:
  access_code_env_var: ACCESS_CODE   # name of the env var holding the real secret
  cors_allowed_origins:
    - http://localhost:8000
  rate_limit_per_minute: 30


# Database
database:
  db_path: data/movies.db

# mode: ollama: uses OllamaExpander (calls a local/remote Ollama server)
# mode: local: uses LocalExpander (custom trained transformer)
expander:
  mode: local

  ollama:
    model:        llama3.2:1b
    num_predict:  60
    temperature:  0.7

  local:
    run_dir: ""   # most recent run 
  
system_prompt: |
  You are helping build training data for a movie search system.
  Given a vague movie query, expand it into a rich, specific description that would
  help find relevant movies in a database of plot summaries.

  Rules:
  - Add specific themes, motifs, and atmosphere words
  - Include genre terminology that appears in plot summaries
  - Mention narrative elements (unreliable narrator, nonlinear structure, etc.)
  - Keep it to 3-4 sentences
  - Output ONLY the expanded query, no preamble, no explanation
  - Never mention specific movie titles