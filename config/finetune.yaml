base_model:  google/flan-t5-small
task_prefix: "expand movie search query: "

data:
  data_path:    data/training_pairs.json
  train_split:  0.9
  seed:         42   # shuffle seed for the train/val split

model:
  max_src_len:  32    # max input tokens
  max_tar_len:  128   # max target tokens

train:
  epochs:         15
  batch_size:     8
  learning_rate:  0.0003

output_dir: artifacts/expander_finetuned
