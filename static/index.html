<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Finder</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0c0b;
      --panel:     #141210;
      --line:      #2b2825;
      --line-soft: #201d1a;
      --fg:        #f2ede4;
      --fg2:       #a49b8e;
      --fg3:       #6f665c;
      --accent:    #e0a45e;
      --accent-2:  #5ea8c8;
      --chip:      #1c1a17;
      --error:     #e08b7a;
      --error-bg:  #241715;
      --radius:    6px;
      --serif:     'Instrument Serif', Georgia, serif;
      --sans:      'IBM Plex Sans', system-ui, sans-serif;
      --mono:      'IBM Plex Mono', ui-monospace, monospace;
    }

    ::selection { background: var(--accent); color: #14120f; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding: 0 24px 90px;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: #f0c48e; }

    .label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg3);
    }

    /* ── Header ──────────────────────────────────────────────────────── */
    header {
      max-width: 760px;
      margin: 0 auto 44px;
      padding: 40px 0 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }
    header h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 34px;
      letter-spacing: -0.01em;
      line-height: 1;
    }
    header p {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg3);
    }

    /* ── Login ───────────────────────────────────────────────────────── */
    .login-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 40px 36px 32px;
      max-width: 420px;
      margin: 40px auto 0;
    }
    .login-card h2 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 30px;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }
    .login-card > p {
      color: var(--fg2);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
      text-wrap: pretty;
    }
    .login-fields { display: flex; flex-direction: column; gap: 10px; }
    .login-fields input {
      padding: 13px 15px;
      font-size: 15px;
      font-family: var(--sans);
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      outline: none;
      transition: border-color 0.15s;
    }
    .login-fields input::placeholder { color: var(--fg3); }
    .login-fields input:focus { border-color: var(--accent); }
    .login-fields button {
      margin-top: 8px;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      font-family: var(--sans);
      background: var(--accent);
      color: #14120f;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .login-fields button:hover { filter: brightness(1.08); }
    .login-error {
      font-family: var(--mono);
      color: var(--error);
      font-size: 12px;
      margin-top: 16px;
      min-height: 18px;
    }

    /* ── User bar ────────────────────────────────────────────────────── */
    .user-bar {
      max-width: 760px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg3);
    }
    .logout-btn {
      background: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 14px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--fg2);
      transition: border-color 0.15s, color 0.15s;
    }
    .logout-btn:hover { border-color: var(--fg3); color: var(--fg); }

    /* ── Search card ─────────────────────────────────────────────────── */
    .search-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px 24px 20px;
      max-width: 760px;
      margin: 0 auto 34px;
    }

    .mode-row { display: flex; gap: 8px; margin-bottom: 18px; }
    .mode-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      color: var(--fg2);
      background: transparent;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      user-select: none;
    }
    .mode-btn:hover { color: var(--fg); }
    .mode-btn input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .radio-dot {
      width: 14px; height: 14px;
      border: 1px solid var(--fg3);
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s;
    }
    .radio-dot::after {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #14120f;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .mode-btn input[type="radio"]:checked ~ .radio-dot { border-color: #14120f; background: #14120f; }
    .mode-btn input[type="radio"]:checked ~ .radio-dot::after { opacity: 1; background: var(--accent); }
    .mode-btn:has(input[type="radio"]:checked) {
      border-color: var(--accent);
      background: var(--accent);
      color: #14120f;
      font-weight: 500;
    }

    .input-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .input-row input {
      flex: 1;
      padding: 14px 16px;
      font-size: 16px;
      font-family: var(--sans);
      border: 1px solid var(--line);
      border-radius: 4px;
      outline: none;
      transition: border-color 0.15s;
      color: var(--fg);
      background: var(--bg);
    }
    .input-row input::placeholder { color: var(--fg3); }
    .input-row input:focus { border-color: var(--accent); }
    .input-row button {
      padding: 14px 30px;
      font-size: 15px;
      font-weight: 500;
      font-family: var(--sans);
      background: var(--accent);
      color: #14120f;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .input-row button:hover  { filter: brightness(1.08); }
    .input-row button:active { transform: scale(0.985); }

    .bottom-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      color: var(--fg2);
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s, color 0.15s;
    }
    .checkbox-label:hover { color: var(--fg); }
    .checkbox-label input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .mode-hint {
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.6;
      color: var(--fg3);
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line-soft);
    }

    /* ── Results ─────────────────────────────────────────────────────── */
    .results-wrap { max-width: 760px; margin: 0 auto; }

    .expanded-note {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
      color: var(--accent);
      margin-bottom: 18px;
      padding: 12px 16px;
      background: var(--chip);
      border: 1px solid var(--line);
      border-left: 2px solid var(--accent);
      border-radius: 0 4px 4px 0;
    }

    .movie-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }
    .movie-card:hover { border-color: var(--fg3); }

    .movie-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }
    .movie-title {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: var(--fg);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 5px 11px;
      border-radius: 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-score { background: var(--chip); color: var(--fg2); border: 1px solid var(--line); }
    .badge-exact { background: var(--accent); color: #14120f; }

    .movie-meta {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--fg3);
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .movie-meta span { margin-right: 0; }
    .movie-plot {
      font-size: 15px;
      line-height: 1.65;
      color: var(--fg2);
      margin-bottom: 18px;
      max-width: 66ch;
      text-wrap: pretty;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 16px;
      border-top: 1px solid var(--line-soft);
    }
    .rating-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg3);
      margin-right: 6px;
    }
    .star-btn {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 5px 9px;
      font-size: 12px;
      line-height: 1.2;
      cursor: pointer;
      color: var(--fg2);
      transition: border-color 0.12s, background 0.12s, transform 0.1s;
    }
    .star-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .star-btn.rated { background: var(--accent); border-color: var(--accent); }
    .rated-thanks {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-left: 8px;
      display: none;
    }

    .state-msg {
      text-align: center;
      padding: 72px 20px;
      color: var(--fg3);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }
    .state-msg .icon { font-size: 30px; margin-bottom: 14px; filter: grayscale(0.35); }
    .error-msg {
      background: var(--error-bg);
      border: 1px solid #4a2c25;
      color: var(--error);
      padding: 15px 18px;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .timing {
      text-align: right;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg3);
      margin-top: 12px;
    }

    @media (max-width: 560px) {
      body { padding: 0 16px 60px; }
      header h1 { font-size: 28px; }
      .movie-title { font-size: 22px; }
      .input-row { flex-direction: column; }
      .mode-row  { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Movie Finder</h1>
    <p>Semantic search &middot; transformer index</p>
  </header>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="login-card">
      <h2>Welcome</h2>
      <p>Enter your name and the access code to start finding movies.</p>
      <div class="login-fields">
        <input type="text"     id="loginName" placeholder="Your name"   autocomplete="off" />
        <input type="password" id="loginCode" placeholder="Access code" autocomplete="off" />
        <button onclick="login()">Continue &rarr;</button>
      </div>
      <p class="login-error" id="loginError"></p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" style="display:none">

    <div class="user-bar">
      <span id="userGreeting"></span>
      <button class="logout-btn" onclick="logout()">Leave</button>
    </div>

    <div class="search-card">
      <div class="mode-row">
        <label class="mode-btn">
          <input type="radio" name="searchMode" value="title" checked onchange="onModeChange()" />
          <span class="radio-dot"></span>
          Search by title
        </label>
        <label class="mode-btn">
          <input type="radio" name="searchMode" value="semantic" onchange="onModeChange()" />
          <span class="radio-dot"></span>
          Describe a movie
        </label>
      </div>

      <div class="input-row">
        <input type="text" id="query" placeholder="e.g. Inception, The Dark Knight..." autocomplete="off" />
        <button onclick="search()">Find</button>
      </div>

      <div class="bottom-row">
        <label class="checkbox-label" id="expandLabel" style="opacity:0.3; pointer-events:none;">
          <input type="checkbox" id="expandQuery" checked />
          Expand vague queries with AI
        </label>
      </div>

      <p class="mode-hint" id="modeHint">
        🎬 Type a movie title — we'll find it and recommend similar movies.
      </p>
    </div>

    <div class="results-wrap" id="results">
      <div class="state-msg">
        <div class="icon">🍿</div>
        <div>Search for a movie to get started</div>
      </div>
    </div>

  </div>

  <script>
    // ── Config ────────────────────────────────────────────────────────────────
    // If using ngrok, set this to your ngrok URL:
    // const API = "https://abc123.ngrok-free.app";
    const API = "";

    // ── State ─────────────────────────────────────────────────────────────────
    let currentUser    = null;
    let accessCode     = null;
    let currentResults = [];   // stores last search results — avoids JS string escaping bugs

    // ── Auth ──────────────────────────────────────────────────────────────────
    function login() {
      const name = document.getElementById("loginName").value.trim();
      const code = document.getElementById("loginCode").value.trim();
      const err  = document.getElementById("loginError");

      if (!name) { err.textContent = "Please enter your name."; return; }
      if (!code)  { err.textContent = "Please enter the access code."; return; }

      err.textContent = "Checking...";

      fetch(`${API}/health`, {
        headers: { "x-access-code": code }
      })
      .then(res => {
        if (res.ok) {
          currentUser = name;
          accessCode  = code;
          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("mainApp").style.display     = "block";
          document.getElementById("userGreeting").textContent  = "👋 Hi, " + name;
          err.textContent = "";
        } else if (res.status === 401) {
          err.textContent = "Wrong access code — try again.";
        } else {
          err.textContent = "Server error. Try again.";
        }
      })
      .catch(() => {
        err.textContent = "Could not reach the server. Is the API running?";
      });
    }

    function logout() {
      currentUser    = null;
      accessCode     = null;
      currentResults = [];
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("mainApp").style.display     = "none";
      document.getElementById("loginName").value = "";
      document.getElementById("loginCode").value = "";
      document.getElementById("loginError").textContent = "";
      setResults('<div class="state-msg"><div class="icon">🍿</div><div>Search for a movie to get started</div></div>');
    }

    function getHeaders() {
      return {
        "Content-Type":  "application/json",
        "x-access-code": accessCode || "",
      };
    }

    // ── Mode ──────────────────────────────────────────────────────────────────
    function getMode() {
      return document.querySelector('input[name="searchMode"]:checked').value;
    }

    function onModeChange() {
      const mode        = getMode();
      const queryInput  = document.getElementById("query");
      const expandLabel = document.getElementById("expandLabel");
      const modeHint    = document.getElementById("modeHint");

      if (mode === "title") {
        queryInput.placeholder          = "e.g. Inception, The Dark Knight...";
        expandLabel.style.opacity       = "0.3";
        expandLabel.style.pointerEvents = "none";
        modeHint.textContent            = "🎬 Type a movie title — we'll find it and recommend similar movies.";
      } else {
        queryInput.placeholder          = "e.g. a dark psychological thriller...";
        expandLabel.style.opacity       = "1";
        expandLabel.style.pointerEvents = "auto";
        modeHint.textContent            = "💡 Describe what you want to watch — we'll find the best matches.";
      }
    }

    // ── Search ────────────────────────────────────────────────────────────────
    async function search() {
      const query       = document.getElementById("query").value.trim();
      const mode        = getMode();
      const expandQuery = document.getElementById("expandQuery").checked;

      if (!query) {
        setResults('<div class="error-msg">Please enter a search query.</div>');
        return;
      }

      setResults(
        '<div class="state-msg"><div class="icon">🔍</div><div>Searching...</div></div>'
      );

      try {
        const res = await fetch(API + "/recommend", {
          method:  "POST",
          headers: getHeaders(),
          body:    JSON.stringify({
            query:        query,
            top_k:        5,
            expand_query: mode === "title" ? false : expandQuery,
            user_id:      currentUser,
            search_mode:  mode,
          })
        });

        if (res.status === 401) {
          setResults('<div class="error-msg">Access denied. Please refresh and log in again.</div>');
          return;
        }
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          setResults('<div class="error-msg">Error: ' + (err.detail || "Something went wrong.") + '</div>');
          return;
        }

        const data = await res.json();
        currentResults = data.results || [];   // store globally — safe reference for rate()
        renderResults(data, query);

      } catch (e) {
        console.error("Search error:", e);
        setResults('<div class="error-msg">Could not connect to the server. Make sure the API is running.</div>');
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function renderResults(data, originalQuery) {
      if (!data.results || data.results.length === 0) {
        setResults('<div class="state-msg"><div class="icon">🤷</div><div>No results found. Try a different query.</div></div>');
        return;
      }

      let html = "";

      if (data.expanded_query) {
        html += '<div class="expanded-note">✨ Expanded to: "' + data.expanded_query + '"</div>';
      }

      html += data.results.map(function(m) {
        var isExact    = m.score === 1.0;
        var scoreText  = isExact ? "Exact match" : (m.score * 100).toFixed(1) + "% match";
        var badgeClass = isExact ? "badge-exact" : "badge-score";
        var badgeIcon  = isExact ? "✓" : "◎";

        var stars = "";
        for (var r = 1; r <= 5; r++) {
          var starEmoji = "";
          for (var s = 0; s < r; s++) starEmoji += "⭐";
          // Use rank as reference — avoids putting title/special chars in onclick
          stars += '<button class="star-btn" id="star-' + m.rank + '-' + r + '" onclick="rate(' + m.rank + ',' + r + ')">' + starEmoji + '</button>';
        }

        return '<div class="movie-card">' +
          '<div class="movie-header">' +
            '<div class="movie-title">' + m.rank + '. ' + m.title + ' <span style="font-weight:400;color:var(--muted)">(' + m.year + ')</span></div>' +
            '<span class="badge ' + badgeClass + '">' + badgeIcon + ' ' + scoreText + '</span>' +
          '</div>' +
          '<div class="movie-meta">' +
            '<span>🎭 ' + (m.genre || "Unknown") + '</span>' +
            '<span>🎬 ' + (m.director || "Unknown") + '</span>' +
          '</div>' +
          '<p class="movie-plot">' + m.plot_summary + '</p>' +
          '<div class="rating-row">' +
            '<span class="rating-label">Rate this:</span>' +
            stars +
            '<span class="rated-thanks" id="thanks-' + m.rank + '">Thanks! ✓</span>' +
          '</div>' +
        '</div>';
      }).join("");

      html += '<p class="timing">Found in ' + data.took_ms + 'ms</p>';
      setResults(html);
    }

    // ── Rate ──────────────────────────────────────────────────────────────────
    // Uses rank to look up movie from currentResults — no special char issues
    async function rate(rank, rating) {
      var movie = null;
      for (var i = 0; i < currentResults.length; i++) {
        if (currentResults[i].rank === rank) {
          movie = currentResults[i];
          break;
        }
      }

      if (!movie) {
        console.error("Movie not found for rank:", rank);
        return;
      }

      try {
        var res = await fetch(API + "/feedback", {
          method:  "POST",
          headers: getHeaders(),
          body:    JSON.stringify({
            user_id:  currentUser,
            movie_id: movie.movie_id,
            title:    movie.title,
            action:   "rate",
            rating:   rating,
            query:    document.getElementById("query").value.trim()
          })
        });

        if (res.ok) {
          // Highlight selected stars
          for (var r = 1; r <= 5; r++) {
            var btn = document.getElementById("star-" + rank + "-" + r);
            if (btn) {
              if (r === rating) {
                btn.classList.add("rated");
              } else {
                btn.classList.remove("rated");
              }
            }
          }
          // Show thanks message
          var thanks = document.getElementById("thanks-" + rank);
          if (thanks) {
            thanks.style.display = "inline";
            setTimeout(function() { thanks.style.display = "none"; }, 2000);
          }
          console.log("Rated:", movie.title, rating, "stars");
        } else {
          var errText = await res.text();
          console.error("Feedback failed:", res.status, errText);
        }
      } catch (e) {
        console.error("Rating error:", e);
      }
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function setResults(html) {
      document.getElementById("results").innerHTML = html;
    }

    // Keyboard shortcuts
    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("loginName").addEventListener("keypress", function(e) {
        if (e.key === "Enter") document.getElementById("loginCode").focus();
      });
      document.getElementById("loginCode").addEventListener("keypress", function(e) {
        if (e.key === "Enter") login();
      });
      document.getElementById("query").addEventListener("keypress", function(e) {
        if (e.key === "Enter") search();
      });
    });
  </script>

</body>
</html>
